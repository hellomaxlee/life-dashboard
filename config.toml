# life-dashboard configuration. Every key here is cited by notes.txt § Goal model.
home_tz = "America/New_York"
hr_max = 189

[zones]
pct = [0.50, 0.60, 0.70, 0.80, 0.90]

[workout]
load_bar = 100
recalibrate_months = 3
calibration_min_runs = 3

[week]
target = 3

[sleep]
target_hours = 7.0

[books]
target_per_year = 12
fallback_to_date_added = true

[wellness]
baseline_days = 28

[wellness.bands]
hrv_pct = -20
rhr_bpm = 5
daylight_min = 20

[claude_usage]
path = "data/claude_usage.json"
stale_hours = 24

[pull]
health_interval_hours = 6
goodreads = "06:30"

[server]
host = "0.0.0.0"
port = 8080

[storage]
db_path = "data/life.db"
raw_dir = "data/raw"

[ingest]
hr_incomplete_ratio = 0.25
# Sleep-stage segments closer than this (minutes, end to next start) are one session.
sleep_gap_min = 60

[ingest.dedupe]
start_window_min = 5
duration_tolerance_pct = 10

[summary]
model = ""
monthly_cap_usd = 3

[scheduler]
enabled = true
usage_poll_seconds = 30
usage_min_read_seconds = 900

[backup]
dir = "data/backups"
time = "03:15"
keep = 14

# Pixoo-64 on the LAN. Empty = no device; nothing is ever pushed. Not yet purchased.
[device]
pixoo_host = ""
# Seconds between rotation screens (15 or more). A clip longer than this keeps its screen
# until it has played once.
screen_seconds = 20
