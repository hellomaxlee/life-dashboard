# life-dashboard configuration. Every key here is cited by notes.txt § Goal model.
home_tz = "America/New_York"
hr_max = 189

[zones]
pct = [0.50, 0.60, 0.70, 0.80, 0.90]

[workout]
load_bar = 100
recalibrate_months = 3
calibration_min_runs = 3

[week]
target = 3

[sleep]
target_hours = 7.0

[books]
target_per_year = 12
fallback_to_date_added = true

[wellness]
baseline_days = 28

[wellness.bands]
hrv_pct = -20
rhr_bpm = 5
daylight_min = 20

[claude_usage]
path = "data/claude_usage.json"
stale_hours = 24

[pull]
health_interval_hours = 6
goodreads = "06:30"

[server]
host = "0.0.0.0"
port = 8080

[storage]
db_path = "data/life.db"
raw_dir = "data/raw"

[ingest]
hr_incomplete_ratio = 0.25

[ingest.dedupe]
start_window_min = 5
duration_tolerance_pct = 10

[summary]
model = ""
monthly_cap_usd = 3

[scheduler]
enabled = true
usage_poll_seconds = 30
usage_min_read_seconds = 900

[backup]
dir = "data/backups"
time = "03:15"
keep = 14

# Metrics engine (notes.txt § Goal model). Recomputes every day's and week's rows from the
# stored tables on an interval and at the day rollover; a late push is picked up by the next run.
[metrics]
recompute_minutes = 15
rollover_time = "00:05"
# A week closes after the first health push following Monday 00:00 local, or after this many
# hours with no push at all.
week_close_grace_hours = 12
# Seconds one HR sample may stand for before the rest of the gap is unscored.
max_sample_gap_s = 300
# Which band crossing becomes the day's one wellness fact when several cross.
wellness_priority = ["hrv_ms", "resting_hr", "daylight_min"]

# Pixoo-64 on the LAN. Empty = no device; nothing is ever pushed. Not yet purchased.
[device]
pixoo_host = ""
# Seconds between rotation screens (15 or more). A clip longer than this keeps its screen
# until it has played once.
screen_seconds = 20
