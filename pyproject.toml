[project]
name = "life-dashboard"
version = "0.1.0"
description = "Single-user life dashboard: Apple Health and Goodreads into weekly progress on a LAN page and a Pixoo-64."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "pillow>=10.3",
    "python-dotenv>=1.0",
    "anthropic>=1.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["_old", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
